<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Scan Clue - Treasure Hunt</title>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
    
    <!-- Supabase & QR Scanner Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root { 
            --bg-color: #131314; 
            --surface-color: #1E1F20; 
            --primary-color: #A8C7FA; 
            --success-color: #81C995; 
            --danger-color: #F2B8B5; 
            --text-primary: #E3E3E3; 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            /* Leaves exact space for Android/iOS status bars */
            padding: calc(env(safe-area-inset-top, 32px) + 16px) 16px 16px; 
        }
        
        .header { text-align: center; margin-bottom: 24px; }
        
        /* Scanner UI */
        #reader-container { 
            background: black; 
            border-radius: 24px; 
            overflow: hidden; 
            position: relative; 
            width: 100%; 
            max-width: 500px; 
            margin: 0 auto; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.5); 
        }
        #reader { width: 100%; border: none; }
        #reader video { object-fit: cover; border-radius: 24px; }

        /* Success Card UI */
        #success-card { 
            display: none; 
            background: var(--surface-color); 
            border-radius: 24px; 
            padding: 40px 24px; 
            text-align: center; 
            max-width: 500px; 
            margin: 0 auto; 
            border: 1px solid #444746; 
        }
        
        .pulse-circle { 
            width: 80px; 
            height: 80px; 
            border-radius: 50%; 
            background: rgba(129, 201, 149, 0.2); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0 auto 24px; 
            animation: pulse 2s infinite; 
        }
        
        @keyframes pulse { 
            0% { box-shadow: 0 0 0 0 rgba(129, 201, 149, 0.4); } 
            70% { box-shadow: 0 0 0 20px rgba(129, 201, 149, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(129, 201, 149, 0); } 
        }

        /* Toast for Errors */
        #toast { 
            position: fixed; 
            bottom: 24px; 
            left: 50%; 
            transform: translateX(-50%) translateY(20px); 
            background: var(--danger-color); 
            color: #410E0B; 
            padding: 14px 24px; 
            border-radius: 12px; 
            font-size: 14px; 
            font-weight: 600; 
            opacity: 0; 
            pointer-events: none; 
            transition: all 0.3s ease; 
            z-index: 3000; 
            white-space: nowrap; 
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div class="header" id="main-header">
        <h1 style="font-size: 24px;">Scan Target Tree</h1>
        <p style="color: #C4C7C5; font-size: 14px; margin-top: 8px;">Find your assigned tree and scan the QR code to lock in your finishing time.</p>
    </div>

    <!-- Scanner Window -->
    <div id="reader-container">
        <div id="reader"></div>
    </div>

    <!-- Success Screen (Hidden by default) -->
    <div id="success-card">
        <div class="pulse-circle">
            <span class="material-symbols-rounded" style="font-size: 48px; color: var(--success-color);">verified</span>
        </div>
        <h2 style="font-size: 28px; margin-bottom: 8px; color: var(--success-color);">Hunt Completed!</h2>
        
        <div style="background: #2D2F31; padding: 16px; border-radius: 16px; margin: 24px 0;">
            <p style="color: #C4C7C5; font-size: 12px; text-transform: uppercase; font-weight: 600; margin-bottom: 4px;">Official End Time</p>
            <h1 id="time-display" style="color: var(--primary-color); font-size: 32px;">--:--:--</h1>
        </div>

        <div style="background: rgba(168, 199, 250, 0.1); border: 1px solid rgba(168, 199, 250, 0.2); padding: 20px; border-radius: 16px;">
            <span class="material-symbols-rounded" style="font-size: 32px; color: var(--primary-color); margin-bottom: 8px;">directions_run</span>
            <h3 style="color: #E3E3E3; margin-bottom: 4px;">Proceed Immediately to</h3>
            <h1 style="color: var(--primary-color);">3D LAB</h1>
        </div>
    </div>

    <div id="toast">Message</div>

    <script>
        const SUPABASE_URL = 'https://jdrksqtrznmuuwkmbvqp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ywElqkUc0IFMha8ld6xe2A_xs5FrD2S';
        
        // FIXED: Renamed to supabaseClient to prevent collision
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Extract and secure Student ID
        const urlParams = new URLSearchParams(window.location.search);
        const rawStudentId = urlParams.get('student_id');
        let realStudentId = null;
        
        if (rawStudentId) {
            realStudentId = (parseInt(rawStudentId, 10) - 5489).toString();
        }

        let html5QrcodeScanner = null;
        let isProcessing = false;

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        // Handle a successful scan by the camera
        async function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return; // Prevent double scanning
            if (!realStudentId) return showToast("Error: Missing Student ID in URL.");

            isProcessing = true;
            html5QrcodeScanner.pause(); // Pause camera while checking database
            
            showToast("Verifying QR Code...");

            // FIXED: Use supabaseClient here
            const { data: finishTime, error } = await supabaseClient.rpc('complete_treasure_hunt', {
                p_student_id: realStudentId,
                p_scanned_qr: decodedText
            });

            if (error) {
                // Wrong QR or Not in team -> Show error and resume scanner
                showToast(error.message);
                setTimeout(() => {
                    isProcessing = false;
                    html5QrcodeScanner.resume();
                }, 3000);
            } else {
                // Correct QR! Stop scanner and show Success Screen
                html5QrcodeScanner.clear();
                document.getElementById('reader-container').style.display = 'none';
                document.getElementById('main-header').style.display = 'none';
                
                // Format the Postgres Timestamp locally
                const dateObj = new Date(finishTime);
                document.getElementById('time-display').innerText = dateObj.toLocaleTimeString('en-IN', {
                    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
                });

                document.getElementById('success-card').style.display = 'block';

                confetti({ particleCount: 200, spread: 90, origin: { y: 0.5 }, colors: ['#A8C7FA', '#81C995'] });
            }
        }

        // Initialize Scanner (GPay style settings)
        function startScanner() {
            if (!realStudentId) {
                alert("Missing Student Credentials in URL!");
                return;
            }

            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", 
                { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0, showTorchButtonIfSupported: true }, 
                /* verbose= */ false
            );
            html5QrcodeScanner.render(onScanSuccess, (error) => { /* Ignore standard scan errors */ });
        }

        // Start scanner on load
        window.onload = startScanner;
    </script>
</body>
</html>
