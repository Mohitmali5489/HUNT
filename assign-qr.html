<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Assign QR Codes (Admin)</title>
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
    
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- QR Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        :root {
            --bg-color: #F0F4F8;
            --surface-color: #FFFFFF;
            --surface-container: #F1F3F4;
            --primary-color: #0B57D0;
            --primary-hover: #0842A0;
            --primary-container: #D3E3FD;
            --on-primary-container: #041E49;
            --border-color: #E0E2E0;
            --text-primary: #1F1F1F;
            --text-secondary: #444746;
            --success-color: #146C2E;
            --danger-color: #B3261E;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background: var(--bg-color);
            color: var(--text-primary);
            padding: calc(env(safe-area-inset-top, 24px) + 16px) 16px 24px;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 20px; }

        .card {
            background: var(--surface-color);
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.08);
            border: 1px solid var(--border-color);
        }

        h2, h3 { font-weight: 600; margin-bottom: 8px; }
        p { color: var(--text-secondary); font-size: 14px; margin-bottom: 20px; line-height: 1.5; }

        label { font-size: 13px; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 6px; }

        select, input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            background: var(--surface-container);
            font-size: 15px;
            color: var(--text-primary);
            outline: none;
            margin-bottom: 16px;
        }
        select:focus, input[type="text"]:focus {
            border-color: var(--primary-color);
            background: var(--surface-color);
        }

        /* Input with Scan button */
        .input-scan-row {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .input-scan-row input { margin-bottom: 0; }
        
        .btn-scan {
            background: var(--primary-container);
            color: var(--on-primary-container);
            border: none;
            border-radius: 14px;
            padding: 0 16px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            white-space: nowrap;
        }

        button.btn-main {
            width: 100%;
            padding: 16px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 100px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s;
        }
        button.btn-main:hover { background: var(--primary-hover); transform: translateY(-1px); }

        /* Scanner Modal Container */
        #scanner-box {
            display: none;
            margin-bottom: 16px;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }
        #reader { width: 100%; border: none; }
        #reader video { object-fit: cover; }
        .close-scanner-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }

        /* Current Assignments list */
        .team-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }
        .team-item:last-child { border-bottom: none; }
        .badge-qr {
            font-family: monospace;
            font-size: 12px;
            background: var(--surface-container);
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            color: var(--primary-color);
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .material-symbols-rounded { vertical-align: middle; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Main Card -->
        <div class="card">
            <h2>Admin: Assign Target QR</h2>
            <p>Assign each team the secret payload of the target tree QR they must scan to finish.</p>
            
            <label for="team-select">Select Locked Team</label>
            <select id="team-select">
                <option value="">Loading locked teams...</option>
            </select>

            <label for="qr-payload">Target QR Text / Code</label>
            <div class="input-scan-row">
                <input type="text" id="qr-payload" placeholder="Type or scan tree QR...">
                <button type="button" class="btn-scan" onclick="toggleScanner()">
                    <span class="material-symbols-rounded" style="font-size: 20px;">qr_code_scanner</span>
                    Scan
                </button>
            </div>

            <!-- In-App Camera View -->
            <div id="scanner-box">
                <button type="button" class="close-scanner-btn" onclick="stopScanner()">
                    <span class="material-symbols-rounded">close</span>
                </button>
                <div id="reader"></div>
            </div>

            <button class="btn-main" onclick="assignQR()" id="btn-assign">
                <span class="material-symbols-rounded">save</span>
                Assign Target to Team
            </button>
        </div>

        <!-- Assignments Overview Card -->
        <div class="card">
            <h3>Current Assignments</h3>
            <div id="assignment-list" style="margin-top: 12px;">Loading...</div>
        </div>
    </div>

    <script>
        // Supabase configuration
        const SUPABASE_URL = 'https://jdrksqtrznmuuwkmbvqp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ywElqkUc0IFMha8ld6xe2A_xs5FrD2S';
        
        // Use supabaseClient to avoid global collision
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let html5QrScanner = null;

        async function loadTeams() {
            const { data: teams, error } = await supabaseClient
                .from('teams')
                .select('*')
                .eq('is_locked', true)
                .order('name', { ascending: true });

            if (error) {
                console.error("Error loading teams:", error);
                return;
            }

            const select = document.getElementById('team-select');
            const list = document.getElementById('assignment-list');

            if (!teams || teams.length === 0) {
                select.innerHTML = '<option value="">No locked teams yet</option>';
                list.innerHTML = '<p style="color:var(--text-secondary); margin:0;">No locked teams found in database.</p>';
                return;
            }

            // Populate dropdown
            select.innerHTML = teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('');

            // Populate list
            list.innerHTML = teams.map(t => `
                <div class="team-item">
                    <strong>${t.name}</strong>
                    ${t.assigned_qr 
                        ? `<span class="badge-qr">${t.assigned_qr}</span>` 
                        : `<span style="font-size: 12px; color: var(--danger-color); font-weight: 600;">Not Assigned</span>`
                    }
                </div>
            `).join('');
        }

        // Camera Scanner Controls
        function toggleScanner() {
            const box = document.getElementById('scanner-box');
            if (box.style.display === 'block') {
                stopScanner();
            } else {
                startScanner();
            }
        }

        function startScanner() {
            document.getElementById('scanner-box').style.display = 'block';
            
            html5QrScanner = new Html5Qrcode("reader");
            html5QrScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 220, height: 220 } },
                (decodedText) => {
                    // QR Scanned successfully
                    document.getElementById('qr-payload').value = decodedText;
                    stopScanner();
                },
                (errorMessage) => {
                    // Scanning frames, ignore
                }
            ).catch(err => {
                alert("Camera permission denied or camera unavailable: " + err);
                stopScanner();
            });
        }

        function stopScanner() {
            if (html5QrScanner) {
                html5QrScanner.stop().then(() => {
                    html5QrScanner.clear();
                    html5QrScanner = null;
                    document.getElementById('scanner-box').style.display = 'none';
                }).catch(() => {
                    document.getElementById('scanner-box').style.display = 'none';
                });
            } else {
                document.getElementById('scanner-box').style.display = 'none';
            }
        }

        // Save Assignment to Supabase
        async function assignQR() {
            const teamId = document.getElementById('team-select').value;
            const payload = document.getElementById('qr-payload').value.trim();

            if (!teamId) return alert("Select a team first.");
            if (!payload) return alert("Enter or scan a QR code text.");

            const btn = document.getElementById('btn-assign');
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-rounded">hourglass_empty</span> Assigning...';

            const { error } = await supabaseClient.rpc('assign_team_qr', {
                p_team_id: teamId,
                p_qr_payload: payload
            });

            if (error) {
                alert("Error: " + error.message);
            } else {
                document.getElementById('qr-payload').value = '';
                await loadTeams();
            }

            btn.disabled = false;
            btn.innerHTML = '<span class="material-symbols-rounded">save</span> Assign Target to Team';
        }

        // Initialize on page load
        loadTeams();
    </script>
</body>
</html>
