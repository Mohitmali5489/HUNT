<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Assign QR Codes (Admin)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary-color: #0B57D0; --surface-color: #FFFFFF; --bg-color: #F0F4F8; --border-color: #E0E2E0; --text-primary: #1F1F1F; --text-secondary: #444746; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text-primary); padding: 24px 16px; margin: 0; }
        .card { background: var(--surface-color); padding: 24px; border-radius: 20px; max-width: 500px; margin: 0 auto 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid var(--border-color); }
        select, input { width: 100%; padding: 14px; margin: 8px 0 16px; border-radius: 12px; border: 1px solid var(--border-color); font-size: 16px; }
        button { width: 100%; padding: 14px; background: var(--primary-color); color: white; border: none; border-radius: 100px; font-weight: 600; font-size: 16px; cursor: pointer; }
        .team-list { margin-top: 24px; font-size: 14px; }
        .team-item { padding: 12px 0; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Admin: Assign Target QR</h2>
        <p style="color: var(--text-secondary); font-size: 14px;">Select a locked team and assign the secret text hidden inside their final tree's QR Code.</p>
        
        <label><b>Select Locked Team</b></label>
        <select id="team-select"><option>Loading teams...</option></select>

        <label><b>Target QR Text</b></label>
        <input type="text" id="qr-payload" placeholder="e.g., BANYAN_TREE_01">

        <button onclick="assignQR()" id="btn-assign">Assign Target to Team</button>
    </div>

    <div class="card team-list">
        <h3>Current Assignments</h3>
        <div id="assignment-list">Loading...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jdrksqtrznmuuwkmbvqp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ywElqkUc0IFMha8ld6xe2A_xs5FrD2S';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadTeams() {
            const { data: teams } = await supabase.from('teams').select('*').eq('is_locked', true);
            
            // Populate Dropdown
            const select = document.getElementById('team-select');
            select.innerHTML = teams.length ? '' : '<option>No locked teams yet</option>';
            teams.forEach(t => { select.innerHTML += `<option value="${t.id}">${t.name}</option>`; });

            // Populate List
            const list = document.getElementById('assignment-list');
            list.innerHTML = teams.map(t => `
                <div class="team-item">
                    <b>${t.name}</b> 
                    <span style="color: ${t.assigned_qr ? 'green' : 'red'}">${t.assigned_qr || 'Unassigned'}</span>
                </div>
            `).join('');
        }

        async function assignQR() {
            const teamId = document.getElementById('team-select').value;
            const payload = document.getElementById('qr-payload').value.trim();
            if(!payload) return alert("Enter QR Text");

            document.getElementById('btn-assign').innerText = "Assigning...";
            const { error } = await supabase.rpc('assign_team_qr', { p_team_id: teamId, p_qr_payload: payload });
            
            if (error) alert(error.message);
            else { alert("Assigned!"); document.getElementById('qr-payload').value = ''; loadTeams(); }
            document.getElementById('btn-assign').innerText = "Assign Target to Team";
        }

        loadTeams();
    </script>
</body>
</html>
